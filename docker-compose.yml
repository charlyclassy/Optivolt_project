# HTTPS deployment. Set DEPOTWATT_DOMAIN in your private .env file.
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DEPOTWATT_ENV: production
      DEPOTWATT_STATE_DIR: /state
      DEPOTWATT_ALLOW_SIGNUP: ${DEPOTWATT_ALLOW_SIGNUP:-false}
    volumes:
      - depotwatt_state:/state
      - depotwatt_models:/app/models
    expose:
      - "8501"
    security_opt:
      - no-new-privileges:true
  proxy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    command: caddy reverse-proxy --from ${DEPOTWATT_DOMAIN:?Set DEPOTWATT_DOMAIN in your private .env file} --to app:8501
    volumes:
      - caddy_data:/data
volumes:
  depotwatt_state:
  depotwatt_models:
  caddy_data:
